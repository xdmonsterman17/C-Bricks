[preset.0]

name="Linux ARM64"
platform="Linux"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="examples/*, scripts/runtime/*, scripts/tools/*, thirdparty/*, prebuilt/*, toolchains_pack/*, toolchains_manifest.json, LICENSE, NOTICE.md"
exclude_filter="build/*, tests/*, reference-plugin/*, tools/*, CLAUDE.md, PROGRESS.md, BUGS.md, DECISIONS.md, DEBUG.md, SetupClaude.sh, export.sh, .claude/*"
export_path="build/linux-arm64/C-Bricks.arm64"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

binary_format/architecture="arm64"
binary_format/embed_pck=true

