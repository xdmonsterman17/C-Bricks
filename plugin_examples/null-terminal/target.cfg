; The bring-up kit: the smallest working target plugin. A "screen" that prints to the terminal,
; a clock that ticks 1/fps per frame, no input. Copy this folder, rename the id, and replace
; backend.c function by function; every optional group you don't define keeps its do-nothing stub
; (scripts/runtime/cb_backend.h says which group is which).
[plugin]
id="null-terminal"
title="Null terminal (bring-up kit)"
version="1"
api=1
description="Draws text to the terminal and runs CB_NULL_FRAMES (default 3) frames. The starting point for a new device target."

[target]
name="Null terminal (bring-up)"
ext="-null-terminal"
candidates=["cc -std=c99 -O2 {src} -o {out} -lm", "gcc -std=c99 -O2 {src} -o {out} -lm", "zig cc -std=c99 -O2 {src} -o {out} -lm"]
run=["{out}"]
caps=["graphics"]

[backend]
file="backend.c"
