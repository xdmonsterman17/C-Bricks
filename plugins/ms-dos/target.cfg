; MS-DOS (DJGPP, 386+): the built-in plugin that proves the format. The target itself (compiler,
; DOSBox-X run, CWSDPMI packaging) is built into Toolchains; this describes its backend.
[plugin]
id="dos"
title="MS-DOS software renderer"
version="1"
api=1
description="Software 2D / 3D into a VGA / VESA screen, keyboard + mouse interrupts, Sound Blaster and OPL sound, Watt-32 networking."

[backend]
file="../../scripts/runtime/cb_be_dos.c"
targets=["dos"]
caps=["graphics", "3d", "network"]
