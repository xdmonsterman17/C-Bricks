; The world copied to players (port 47314): a dedicated server destroys the scene's Crate,
; sets the Sign's text, makes a Ball (When created: on the server only) and changes it (x,
; label, pos gliding, a rename, a friend Ball made then destroyed). Client a joins at the
; start (--join: the Main scene's Sign is matched, its LocalScript still runs under it); b
; starts single-player and Joins 1.2 s later (the whole world at once; its own Crate goes).
; Lamp is in the group local: never sent, every machine keeps its own. secret isn't Synced;
; spot is Synced with "!" (spot!): it jumps, so a2 sees exactly (2, 0, 0) while pos still glides.
; Generated by tests/make_net_cases.py: change it there.
[case]
peers=["--server 47314", "--join 127.0.0.1:47314 --name ada --tag a", "--name bob --tag b --late"]
peer_delay=0.3
expect_peer0_order=["[created] a Ball", "[created] a Ball", "[server] done"]
expect_peer0_missing=["[hud]", "[a1]"]
expect_peer1_order=["[hud] under Sign", "[a1] sign=hello crate=false", "[a1] lamp=true", "[a1] ball Ball x=1", "[a1] label=one pos=(0, 0, 0)", "[a1] friend=false secret=0", "[a2] ball Bally x=2", "[a2] label=two pos=", "[a2] friend=true secret=0", "[a2] spot=(2, 0, 0)", "[a3] ball Bally x=3", "[a3] label=three pos=(1, 0, 0)", "[a3] friend=false"]
expect_peer1_missing=["[created]"]
expect_peer2_order=["[hud] under Sign", "[late] joined true", "[b1] sign=hello crate=false", "[b1] lamp=true", "[b1] ball Bally x=2", "[b1] label=two pos=(1, 0, 0)", "[b1] friend=true", "[b3] ball Bally x=3"]
expect_peer2_missing=["[created]"]
